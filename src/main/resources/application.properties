# ===========================================
# MEPIT Backend - Configuração da Aplicação
# ===========================================

# Porta do servidor
server.port=8080

# ===========================================
# Base de Dados H2 (Desenvolvimento)
# ===========================================
spring.datasource.url=jdbc:h2:mem:mepitdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console H2 (para desenvolvimento)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================================
# JWT Configuração
# ===========================================
app.jwt.secret=mepitJwtSecretKey2024VeryLongAndSecureKeyForTokenGeneration
app.jwt.expiration-ms=86400000

# ===========================================
# Logging
# ===========================================
logging.level.org.springframework.web=INFO
logging.level.com.mepit=DEBUG

# ===========================================
# CORS (permitir frontend React)
# ===========================================
app.cors.allowed-origins=http://localhost:3000
